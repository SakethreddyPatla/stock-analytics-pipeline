version: '3.8'
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.0
  environment: 
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    PYTHONPATH: /opt/airflow
    FINNHUB_API_KEY: ${FINNHUB_API_KEY}
    GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}
    GCP_PROJECT_ID: ${GCP_PROJECT_ID}
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/gcp-crendentials.json

volumes:
  - ./dags:/opt/airflow/dags
  - ./logs:/opt/airflow/logs
  - ./plugins:/opt/airflow/plugins
  - ../ingestion:/opt/airflow/ingestion
  - ../dbt_project/stock_analytics:/opt/airflow/dbt_project
  - ${USERPROFILE}/.config/gcloud:/homw/airflow/.config/gcloud

user: "50000:0"
depends_on:
  postgres:
    condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 30s
    
  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin

  airflow-webserver:
  <<: *airflow-common
  command: webserver
  ports:
    - "8080:8084"
  healthcheck:
    test: ["CMD", "curl", "--fail", "http://localhost:8084/health"]
    interval: 30s
    retries: 3

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler