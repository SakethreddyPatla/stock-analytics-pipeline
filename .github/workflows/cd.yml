name: CD 

on: 
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # "env" at job level sets environment variables available
    # to ALL steps in this job. This avoids repeating them.
    # We don't put real secrets here ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â we reference GitHub Secrets
    # which are encrypted and never visible in logs.
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}

    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Python Setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install tools
      - name: Install dependencies
        run: |
          pip install dbt-bigquery==1.7.0 \
                      google-cloud-bigquery==3.11.4 \
                      google-cloud-storage==2.10.0 \
                      sqlfluff==3.0.7 \
                      # sqlfluff-templater-dbt not needed with jinja templater
      - name: Create CI profiles.yml
        working-directory: dbt_project/stock_analytics
        run: |
          cat > profiles.yml << 'EOF'
          stock_analytics:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: project-933aee0c-10bd-4ab1-888
                dataset: staging
                threads: 1
                timeout_seconds: 300
                location: US
          EOF
      # Step 4: Lint
      # We lint on CD too ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â belt and suspenders approach.
      # If somehow a bad lint slipped through CI, we catch it here.
      - name: Lint SQL with sqlfluff
        working-directory: dbt_project/stock_analytics
        run: |
          sqlfluff lint models/ --dialect bigquery

      # Step 5: dbt compile
      # Same compile check as CI but now on the merged code.
      # Confirms the final merged state is still valid.
      - name: dbt compile
        working-directory: dbt_project/stock_analytics
        run: |
          dbt parse \
            --project-dir . \
            --profiles-dir . \
            --log-path /tmp/dbt-logs \
            --target-path /tmp/dbt-target \
            --no-partial-parse

      # Step 6: Production deploy simulation
      - name: Deploy to production
        run: |
          echo " SQL lint passed"
          echo " dbt compile passed ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â all model references valid"
          echo " In production this would:"
          echo "  1. Run dbt run against BigQuery marts"
          echo "  2. Run dbt test ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â fail deploy if data quality breaks"
          echo "  3. Generate dbt docs and upload to GCS"
          echo "  4. Trigger Airflow DAG via REST API"
          echo "  Project: $GCP_PROJECT_ID"
          echo "  Bucket:  $GCS_BUCKET_NAME"  