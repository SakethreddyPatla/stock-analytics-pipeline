name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install \
            dbt-bigquery==1.7.0 \
            google-cloud-bigquery==3.11.4 \
            google-cloud-storage==2.10.0 \
            sqlfluff==3.0.7

      - name: Create profiles.yml
        working-directory: dbt_project/stock_analytics
        run: |
          cat > profiles.yml << EOF
          stock_analytics:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: project-933aee0c-10bd-4ab1-888
                dataset: staging
                threads: 1
                timeout_seconds: 300
                location: US
          EOF

      - name: Lint SQL
        working-directory: dbt_project/stock_analytics
        run: |
          sqlfluff lint models/ --dialect bigquery

      - name: dbt parse
        working-directory: dbt_project/stock_analytics
        run: |
          dbt parse \
            --project-dir . \
            --profiles-dir . \
            --log-path /tmp/dbt-logs \
            --target-path /tmp/dbt-target \
            --no-partial-parse
