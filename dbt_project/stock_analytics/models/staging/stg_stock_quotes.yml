version: 2

models:
  - name: stg_stock_quotes
    description: "Cleaned and typed daily stock quotes from raw layer"
    columns:
      - name: symbol
        description: "Stock ticker symbol"
        tests:
          - not_null
          - accepted_values:
              values: ['AAPL','MSFT','GOOGL','NVDA','META',
                       'JPM','BAC','GS','V','MA',
                       'JNJ','PFE','UNH','ABBV','MRK',
                       'XOM','CVX','COP','WMT','AMZN']

      - name: trade_date
        description: "Trading date"
        tests:
          - not_null

      - name: close_price
        description: "Closing price - must be positive"
        tests:
          - not_null

      - name: day_direction
        tests:
          - accepted_values:
              values: ['up', 'down', 'flat']